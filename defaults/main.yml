---
# Project source code URL: https://github.com/dedicatedcode/reitti

reitti_enabled: true

reitti_identifier: reitti
reitti_base_path: "{{ reitti_base_path }}/reitti"
reitti_tilecache_base_path: "{{ reitti_base_path }}/server"
reitti_tilecache_data_path: "{{ reitti_tilecache_base_path }}/data"

reitti_uid: ""
reitti_gid: ""

# The hostname at which Reitti is served.
reitti_hostname: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
reitti_container_network: "{{ reitti_identifier }}"

# Control if the container network is deleted on uninstalling.
reitti_container_network_deletion_enabled: true

# Specify the Reitti server instance URL
reitti_environment_variables_server_url: "{{ reitti_tilecache_scheme }}://{{ reitti_hostname }}{{ reitti_tilecache_path_prefix }}"

# Specify APP_URL
reitti_environment_variables_app_url: "{{ reitti_environment_variables_server_url }}"

# reitti_restart_necessary controls whether the Reitti systemd
# services will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
reitti_restart_necessary: false

########################################################################
#                                                                      #
# reitti                                                               #
#                                                                      #
########################################################################

# renovate: datasource=docker depName=dedicatedcode/reitti
reitti_version: 4.0.0

reitti_scheme: https

reitti_hostname: "{{ reitti_hostname }}"

# The path at which Reitti is exposed
reitti_path_prefix: "/"

reitti_container_image: "{{ reitti_container_image_registry_prefix }}dedicatedcode/reitti:{{ reitti_container_image_tag }}"
reitti_container_image_tag: "{{ reitti_version }}"
reitti_container_image_registry_prefix: "{{ reitti_container_image_registry_prefix_upstream }}"
reitti_container_image_registry_prefix_upstream: "{{ reitti_container_image_registry_prefix_upstream_default }}"
reitti_container_image_registry_prefix_upstream_default: docker.io/
reitti_container_image_force_pull: "{{ reitti_container_image.endswith(':latest') }}"

reitti_container_network: "{{ reitti_container_network }}"

# Specify how the Reitti container publishes its HTTP port (as defined by `reitti_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
reitti_container_http_host_bind_port: ""

# The port number in the container
reitti_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
reitti_container_additional_networks: "{{ reitti_container_additional_networks_auto + reitti_container_additional_networks_custom }}"
reitti_container_additional_networks_auto: []
reitti_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
reitti_container_additional_volumes: "{{ reitti_container_additional_volumes_auto + reitti_container_additional_volumes_custom }}"
reitti_container_additional_volumes_auto: []
reitti_container_additional_volumes_custom: []

# reitti_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `reitti_container_labels_additional_labels_custom`.
reitti_container_labels_traefik_enabled: true
reitti_container_labels_traefik_docker_network: "{{ reitti_container_network }}"
reitti_container_labels_traefik_hostname: "{{ reitti_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/reitti`).
reitti_container_labels_traefik_path_prefix: "{{ reitti_path_prefix }}"
reitti_container_labels_traefik_rule: "Host(`{{ reitti_container_labels_traefik_hostname }}`){% if reitti_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ reitti_container_labels_traefik_path_prefix }}`){% endif %}"
reitti_container_labels_traefik_priority: 0
reitti_container_labels_traefik_entrypoints: web-secure
reitti_container_labels_traefik_tls: "{{ reitti_container_labels_traefik_entrypoints != 'web' }}"
reitti_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `reitti_container_labels_traefik_additional_request_headers_custom`
reitti_container_labels_traefik_additional_request_headers: "{{ reitti_container_labels_traefik_additional_request_headers_auto | combine(reitti_container_labels_traefik_additional_request_headers_custom) }}"
reitti_container_labels_traefik_additional_request_headers_auto: {}
reitti_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `reitti_container_labels_traefik_additional_response_headers_custom`
reitti_container_labels_traefik_additional_response_headers: "{{ reitti_container_labels_traefik_additional_response_headers_auto | combine(reitti_container_labels_traefik_additional_response_headers_custom) }}"
reitti_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': reitti_http_header_xss_protection} if reitti_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': reitti_http_header_content_type_options} if reitti_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': reitti_http_header_content_security_policy} if reitti_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': reitti_http_header_permissions_policy} if reitti_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': reitti_http_header_strict_transport_security} if reitti_http_header_strict_transport_security and reitti_container_labels_traefik_tls else {})
  }}
reitti_container_labels_traefik_additional_response_headers_custom: {}

# reitti_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# To add your own custom labels, use `reitti_container_labels_additional_labels_custom`
# See `../templates/labels.j2` for details.
#
# Example:
# reitti_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
reitti_container_labels_additional_labels: "{{ reitti_container_labels_additional_labels_auto + reitti_container_labels_additional_labels_custom }}"
reitti_container_labels_additional_labels_auto: []
reitti_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
reitti_container_extra_arguments: "{{ reitti_container_extra_arguments_auto + reitti_container_extra_arguments_custom }}"
reitti_container_extra_arguments_auto: []
reitti_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
reitti_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
reitti_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
reitti_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
reitti_http_header_permissions_policy: "{{ 'interest-cohort=()' if reitti_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
reitti_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if reitti_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `reitti_http_header_permissions_policy`
reitti_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `reitti_http_header_strict_transport_security`
reitti_hsts_preload_enabled: false

# List of systemd services that the Reitti systemd service depends on
reitti_systemd_required_services_list: "{{ reitti_systemd_required_services_list_default + reitti_systemd_required_services_list_auto + reitti_systemd_required_services_list_custom }}"
reitti_systemd_required_services_list_default: |
  {{
    ([devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [])
    +
    ([reitti_tilecache_identifier ~ '.service'])
  }}
reitti_systemd_required_services_list_auto: []
reitti_systemd_required_services_list_custom: []

# List of systemd services that the Reitti systemd service wants
reitti_systemd_wanted_services_list: "{{ reitti_systemd_wanted_services_list_default + reitti_systemd_wanted_services_list_auto + reitti_systemd_wanted_services_list_custom }}"
reitti_systemd_wanted_services_list_default: []
reitti_systemd_wanted_services_list_auto: []
reitti_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
reitti_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
reitti_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
reitti_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
reitti_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ reitti_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ reitti_container_stop_grace_time_seconds }} {{ reitti_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ reitti_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ reitti_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ reitti_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ reitti_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ reitti_identifier }} after {{ reitti_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Control if mailer is enabled
reitti_mailer_enabled: false

# Specify the timezone
reitti_environment_variables_tz: UTC

# Specify the Meilisearch server instance URL to enable the search and filtering functions
reitti_environment_variables_meilisearch_url: ""

# Additional environment variables.
reitti_environment_variables_additional_variables: ""

