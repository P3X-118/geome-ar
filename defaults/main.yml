reitti_tilecache_version: 4.0.0

reitti_tilecache_scheme: https

reitti_tilecache_hostname: "{{ reitti_hostname }}"

# The path at which Reitti tile cache server is exposed
reitti_tilecache_path_prefix: "/bar"

reitti_tilecache_container_image: "{{ reitti_tilecache_container_image_registry_prefix }}dedicatedcode/reitti-tile-cache:{{ reitti_tilecache_container_image_tag }}"
reitti_tilecache_container_image_tag: "{{ reitti_tilecache_version }}"
reitti_tilecache_container_image_registry_prefix: "{{ reitti_tilecache_container_image_registry_prefix_upstream }}"
reitti_tilecache_container_image_registry_prefix_upstream: "{{ reitti_tilecache_container_image_registry_prefix_upstream_default }}"
reitti_tilecache_container_image_registry_prefix_upstream_default: docker.io/
reitti_tilecache_container_image_force_pull: "{{ reitti_container_image.endswith(':latest') }}"

reitti_tilecache_container_network: "{{ reitti_container_network }}"

# Specify how Reitti tile cache server container publishes its HTTP port (as defined by `reitti_tilecache_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
reitti_tilecache_container_http_host_bind_port: ""

# The port number in the container
reitti_tilecache_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
reitti_tilecache_container_additional_networks: "{{ reitti_tilecache_container_additional_networks_auto + reitti_tilecache_container_additional_networks_custom }}"
reitti_tilecache_container_additional_networks_auto: []
reitti_tilecache_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
reitti_tilecache_container_additional_volumes: "{{ reitti_tilecache_container_additional_volumes_auto + reitti_tilecache_container_additional_volumes_custom }}"
reitti_tilecache_container_additional_volumes_auto: []
reitti_tilecache_container_additional_volumes_custom: []

# reitti_tilecache_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels_tilecache.j2` for details.
#
# To inject your own other container labels, see `reitti_tilecache_container_labels_additional_labels_custom`.
reitti_tilecache_container_labels_traefik_enabled: true
reitti_tilecache_container_labels_traefik_docker_network: "{{ reitti_tilecache_container_network }}"
reitti_tilecache_container_labels_traefik_hostname: "{{ reitti_tilecache_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/server`).
reitti_tilecache_container_labels_traefik_path_prefix: "{{ reitti_tilecache_path_prefix }}"
reitti_tilecache_container_labels_traefik_rule: "Host(`{{ reitti_tilecache_container_labels_traefik_hostname }}`){% if reitti_tilecache_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ reitti_tilecache_container_labels_traefik_path_prefix }}`){% endif %}"
reitti_tilecache_container_labels_traefik_priority: 0
reitti_tilecache_container_labels_traefik_entrypoints: web-secure
reitti_tilecache_container_labels_traefik_tls: "{{ reitti_tilecache_container_labels_traefik_entrypoints != 'web' }}"
reitti_tilecache_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls if labels are added to expose the Prometheus metrics publicly.
reitti_tilecache_container_labels_traefik_metrics_enabled: "{{ reitti_tilecache_environment_variables_metrics_enabled }}"
reitti_tilecache_container_labels_traefik_metrics_hostname: "{{ reitti_tilecache_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/metrics`).
reitti_tilecache_container_labels_traefik_metrics_path_prefix: /metrics
reitti_tilecache_container_labels_traefik_metrics_rule: "Host(`{{ reitti_tilecache_container_labels_traefik_metrics_hostname }}`){% if reitti_tilecache_container_labels_traefik_metrics_path_prefix != '/' %} && PathPrefix(`{{ reitti_tilecache_container_labels_traefik_metrics_path_prefix }}`){% endif %}"
reitti_tilecache_container_labels_traefik_metrics_priority: 0
reitti_tilecache_container_labels_traefik_metrics_entrypoints: "{{ reitti_tilecache_container_labels_traefik_entrypoints }}"
reitti_tilecache_container_labels_traefik_metrics_middlewares: []
reitti_tilecache_container_labels_traefik_metrics_tls: "{{ reitti_tilecache_container_labels_traefik_metrics_entrypoints != 'web' }}"
reitti_tilecache_container_labels_traefik_metrics_tls_certResolver: "{{ reitti_tilecache_container_labels_traefik_tls_certResolver }}"  # noqa var-naming
reitti_tilecache_container_labels_traefik_metrics_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
reitti_tilecache_container_labels_traefik_metrics_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `reitti_tilecache_container_labels_traefik_additional_request_headers_custom`
reitti_tilecache_container_labels_traefik_additional_request_headers: "{{ reitti_tilecache_container_labels_traefik_additional_request_headers_auto | combine(reitti_tilecache_container_labels_traefik_additional_request_headers_custom) }}"
reitti_tilecache_container_labels_traefik_additional_request_headers_auto: {}
reitti_tilecache_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `reitti_tilecache_container_labels_traefik_additional_response_headers_custom`
reitti_tilecache_container_labels_traefik_additional_response_headers: "{{ reitti_tilecache_container_labels_traefik_additional_response_headers_auto | combine(reitti_tilecache_container_labels_traefik_additional_response_headers_custom) }}"
reitti_tilecache_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': reitti_tilecache_http_header_xss_protection} if reitti_tilecache_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': reitti_tilecache_http_header_content_type_options} if reitti_tilecache_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': reitti_tilecache_http_header_content_security_policy} if reitti_tilecache_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': reitti_tilecache_http_header_permissions_policy} if reitti_tilecache_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': reitti_tilecache_http_header_strict_transport_security} if reitti_tilecache_http_header_strict_transport_security and reitti_tilecache_container_labels_traefik_tls else {})
  }}
reitti_tilecache_container_labels_traefik_additional_response_headers_custom: {}

# reitti_tilecache_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# To add your own custom labels, use `reitti_tilecache_container_labels_additional_labels_custom`
# See `../templates/labels_tilecache.j2` for details.
#
# Example:
# reitti_tilecache_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
reitti_tilecache_container_labels_additional_labels: "{{ reitti_tilecache_container_labels_additional_labels_auto + reitti_tilecache_container_labels_additional_labels_custom }}"
reitti_tilecache_container_labels_additional_labels_auto: []
reitti_tilecache_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
reitti_tilecache_container_extra_arguments: "{{ reitti_tilecache_container_extra_arguments_auto + reitti_tilecache_container_extra_arguments_custom }}"
reitti_tilecache_container_extra_arguments_auto: []
reitti_tilecache_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
reitti_tilecache_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
reitti_tilecache_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
reitti_tilecache_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
reitti_tilecache_http_header_permissions_policy: "{{ 'interest-cohort=()' if reitti_tilecache_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
reitti_tilecache_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if reitti_tilecache_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `reitti_tilecache_http_header_permissions_policy`
reitti_tilecache_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `reitti_http_header_strict_transport_security`
reitti_tilecache_hsts_preload_enabled: false

# List of systemd services that the Reitti tile cache server systemd service depends on
reitti_tilecache_systemd_required_services_list: "{{ reitti_tilecache_systemd_required_services_list_default + reitti_tilecache_systemd_required_services_list_auto + reitti_tilecache_systemd_required_services_list_custom }}"
reitti_tilecache_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
reitti_tilecache_systemd_required_services_list_auto: []
reitti_tilecache_systemd_required_services_list_custom: []

# List of systemd services that the Reitti tile cache server systemd service wants
reitti_tilecache_systemd_wanted_services_list: "{{ reitti_tilecache_systemd_wanted_services_list_default + reitti_tilecache_systemd_wanted_services_list_auto + reitti_tilecache_systemd_wanted_services_list_custom }}"
reitti_tilecache_systemd_wanted_services_list_default: []
reitti_tilecache_systemd_wanted_services_list_auto: []
reitti_tilecache_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
reitti_tilecache_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
reitti_tilecache_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
reitti_tilecache_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
reitti_tilecache_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ reitti_tilecache_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ reitti_tilecache_container_stop_grace_time_seconds }} {{ reitti_tilecache_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ reitti_tilecache_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ reitti_tilecache_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ reitti_tilecache_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ reitti_tilecache_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ reitti_tilecache_identifier }} after {{ reitti_tilecache_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

reitti_redis_hostname: ""

# Specify the timezone
reitti_tilecache_environment_variables_tz: UTC

# Specify a Meilisearch hostname to enable the search and filtering functions
reitti_tilecache_environment_variables_meilisearch_host: ""

# Specify a Meilisearch API key to enable the search and filtering functions
# Note that the default Admin API Key is sufficient for using Meilisearch on the service
reitti_tilecache_environment_variables_meilisearch_key: ""

# Control if the /metrics endpoint for Prometheus is enabled
reitti_tilecache_environment_variables_metrics_enabled: false

# Specify a comma-separated list of IP addresses allowed to access metrics endpoint
reitti_tilecache_environment_variables_metrics_allowed_ips: ""

# Specify Traefik container name
reitti_tilecache_traefik_name: ""

# Control if user registration is allowed
reitti_tilecache_environment_variables_allow_registration: false

# Specify mailer driver
# Valid values: log, smtp
reitti_tilecache_environment_variables_mail_mailer: ""

# Specify SMTP server hostname
reitti_tilecache_environment_variables_mail_host: ""

# Specify SMTP server port
reitti_tilecache_environment_variables_mail_port: 587

# Specify SMTP server encryption
# Set `tls` to enable TLS encryption
reitti_tilecache_environment_variables_mail_encryption: ""

# Specify SMTP server username
reitti_tilecache_environment_variables_mail_username: ""

# Specify SMTP server password
reitti_tilecache_environment_variables_mail_password: ""

# Specify the email address that emails will be sent from
reitti_tilecache_environment_variables_mail_from_address: ""

# Specify the name that emails will be sent from
reitti_tilecache_environment_variables_mail_from_name: ""

# Control if debug mode is enabled
reitti_tilecache_environment_variables_app_debug: false

# Additional environment variables.
reitti_tilecache_environment_variables_additional_variables: ""

