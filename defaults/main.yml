---
# Project source code URL: https://github.com/dedicatedcode/reitti

geome_enabled: true

geome_identifier: geome
geome_base_path: "/{{ geome_identifier }}"
geome_data_path: "{{ geome_base_path }}/data"
geome_tilecache_base_path: "{{ geome_base_path }}/tilecache"
geome_tilecache_data_path: "{{ geome_tilecache_base_path }}/data"

geome_uid: ""
geome_gid: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
geome_container_network: "{{ geome_identifier }}"

# Control if the container network is deleted on uninstalling.
geome_container_network_deletion_enabled: true

# geome_restart_necessary controls whether the Geome systemd
# services will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
geome_restart_necessary: false

########################################################################
#                                                                      #
# geome                                                               #
#                                                                      #
########################################################################

# renovate: datasource=docker depName=dedicatedcode/reitti
geome_version: 4.0.4

geome_scheme: https

# The hostname at which Geome is served.
geome_hostname: ""

# The path at which Geome is exposed
geome_path_prefix: "/"

geome_container_image: "{{ geome_container_image_registry_prefix }}dedicatedcode/reitti:{{ geome_container_image_tag }}"
geome_container_image_tag: "{{ geome_version }}"
geome_container_image_registry_prefix: "{{ geome_container_image_registry_prefix_upstream }}"
geome_container_image_registry_prefix_upstream: "{{ geome_container_image_registry_prefix_upstream_default }}"
geome_container_image_registry_prefix_upstream_default: docker.io/
geome_container_image_force_pull: "{{ geome_container_image.endswith(':latest') }}"

# Specify how the Geome container publishes its HTTP port (as defined by `geome_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
geome_container_http_host_bind_port: ""

# The port number in the container
geome_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
geome_container_additional_networks: "{{ geome_container_additional_networks_auto + geome_container_additional_networks_custom }}"
geome_container_additional_networks_auto: []
geome_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
geome_container_additional_volumes: "{{ geome_container_additional_volumes_auto + geome_container_additional_volumes_custom }}"
geome_container_additional_volumes_auto: []
geome_container_additional_volumes_custom: []

# geome_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `geome_container_labels_additional_labels_custom`.
geome_container_labels_traefik_enabled: true
geome_container_labels_traefik_docker_network: "{{ geome_container_network }}"
geome_container_labels_traefik_hostname: "{{ geome_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/geome`).
geome_container_labels_traefik_path_prefix: "{{ geome_path_prefix }}"
geome_container_labels_traefik_rule: "Host(`{{ geome_container_labels_traefik_hostname }}`){% if geome_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ geome_container_labels_traefik_path_prefix }}`){% endif %}"
geome_container_labels_traefik_priority: 0
geome_container_labels_traefik_entrypoints: web-secure
geome_container_labels_traefik_tls: "{{ geome_container_labels_traefik_entrypoints != 'web' }}"
geome_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `geome_container_labels_traefik_additional_request_headers_custom`
geome_container_labels_traefik_additional_request_headers: "{{ geome_container_labels_traefik_additional_request_headers_auto | combine(geome_container_labels_traefik_additional_request_headers_custom) }}"
geome_container_labels_traefik_additional_request_headers_auto: {}
geome_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `geome_container_labels_traefik_additional_response_headers_custom`
geome_container_labels_traefik_additional_response_headers: "{{ geome_container_labels_traefik_additional_response_headers_auto | combine(geome_container_labels_traefik_additional_response_headers_custom) }}"
geome_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': geome_http_header_xss_protection} if geome_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': geome_http_header_content_type_options} if geome_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': geome_http_header_content_security_policy} if geome_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': geome_http_header_permissions_policy} if geome_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': geome_http_header_strict_transport_security} if geome_http_header_strict_transport_security and geome_container_labels_traefik_tls else {})
  }}
geome_container_labels_traefik_additional_response_headers_custom: {}

# geome_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# To add your own custom labels, use `geome_container_labels_additional_labels_custom`
# See `../templates/labels.j2` for details.
#
# Example:
# geome_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
geome_container_labels_additional_labels: "{{ geome_container_labels_additional_labels_auto + geome_container_labels_additional_labels_custom }}"
geome_container_labels_additional_labels_auto: []
geome_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
geome_container_extra_arguments: "{{ geome_container_extra_arguments_auto + geome_container_extra_arguments_custom }}"
geome_container_extra_arguments_auto: []
geome_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
geome_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
geome_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
geome_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
geome_http_header_permissions_policy: "{{ 'interest-cohort=()' if geome_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
geome_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if geome_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `geome_http_header_permissions_policy`
geome_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `geome_http_header_strict_transport_security`
geome_hsts_preload_enabled: false

# List of systemd services that the Geome systemd service depends on
geome_systemd_required_services_list: "{{ geome_systemd_required_services_list_default + geome_systemd_required_services_list_auto + geome_systemd_required_services_list_custom }}"
geome_systemd_required_services_list_default: |
  {{
    ([devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [])
    +
    ([geome_tilecache_identifier ~ '.service'])
  }}
geome_systemd_required_services_list_auto: []
geome_systemd_required_services_list_custom: []

# List of systemd services that the Geome systemd service wants
geome_systemd_wanted_services_list: "{{ geome_systemd_wanted_services_list_default + geome_systemd_wanted_services_list_auto + geome_systemd_wanted_services_list_custom }}"
geome_systemd_wanted_services_list_default: []
geome_systemd_wanted_services_list_auto: []
geome_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
geome_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
geome_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
geome_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
geome_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ geome_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ geome_container_stop_grace_time_seconds }} {{ geome_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ geome_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ geome_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ geome_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ geome_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ geome_identifier }} after {{ geome_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify database configuration
geome_database_hostname: ""
geome_database_port: 5432
geome_database_username: geome
geome_database_password: ""
geome_database_name: geome

# Specify Redis configuration
geome_redis_hostname: ""
geome_redis_port: 6379
geome_redis_username: ""
geome_redis_password: ""
geome_redis_database: "0"

# Specify the timezone
geome_environment_variables_tz: UTC

geome_environment_variables_logging_level: INFO

########################################################################
#                                                                      #
# map_bounds — restrict the map to a specific geographic area          #
#                                                                      #
# The viewport is CENTERED on Mont Belvieu / 77523 (the eagledrive.live #
# coverage footprint) but the hard pan limit (maxBounds) is the wider  #
# Houston ↔ Beaumont box — the user must not be able to pan the map     #
# wider than the greater Houston/Beaumont metro span.                   #
#                                                                      #
# Passed to the container as GEOME_MAP_* env. Honored by this fork's    #
# GeomeMapBoundsAdvice → window.geomeMapConfig → map-renderer.js, which #
# sets MapLibre `maxBounds` (strict) + center/zoom.                     #
#                                                                      #
########################################################################

# Southwest corner [lat, lng] — south/west of Houston, with margin.
geome_map_bounds_sw_lat: 29.45
geome_map_bounds_sw_lng: -95.65

# Northeast corner [lat, lng] — north/east of Beaumont, with margin.
geome_map_bounds_ne_lat: 30.35
geome_map_bounds_ne_lng: -93.95

# Default map center on first load — Mont Belvieu (77523).
geome_map_center_lat: 29.844
geome_map_center_lng: -94.890

# Zoom levels. min_zoom 9 ≈ the whole Houston–Beaumont span fits;
# default 11 frames the 77523 area; can't zoom out past the box.
geome_map_min_zoom: 9
geome_map_max_zoom: 18
geome_map_default_zoom: 11

# Strictness: when true, MapLibre's `maxBounds` is enforced — the user
# physically can't pan outside the Houston↔Beaumont box. When false,
# bounds are a soft initial framing but panning is unrestricted.
geome_map_bounds_strict: true

# Additional environment variables.
geome_environment_variables_additional_variables: ""

