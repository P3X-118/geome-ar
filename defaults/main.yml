  {{
    {}
    | combine ({'X-XSS-Protection': geome_tilecache_http_header_xss_protection} if geome_tilecache_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': geome_tilecache_http_header_content_type_options} if geome_tilecache_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': geome_tilecache_http_header_content_security_policy} if geome_tilecache_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': geome_tilecache_http_header_permissions_policy} if geome_tilecache_http_header_permissions_policy else {})
