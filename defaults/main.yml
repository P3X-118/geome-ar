geome_tilecache_systemd_wanted_services_list: "{{ geome_tilecache_systemd_wanted_services_list_default + geome_tilecache_systemd_wanted_services_list_auto + geome_tilecache_systemd_wanted_services_list_custom }}"
geome_tilecache_systemd_wanted_services_list_default: []
geome_tilecache_systemd_wanted_services_list_auto: []
geome_tilecache_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
geome_tilecache_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
geome_tilecache_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
geome_tilecache_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
geome_tilecache_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ geome_tilecache_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ geome_tilecache_container_stop_grace_time_seconds }} {{ geome_tilecache_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ geome_tilecache_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ geome_tilecache_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ geome_tilecache_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ geome_tilecache_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ geome_tilecache_identifier }} after {{ geome_tilecache_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
geome_tilecache_environment_variables_tz: UTC

# Additional environment variables.
geome_tilecache_environment_variables_additional_variables: ""

