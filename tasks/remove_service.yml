---
- name: "Check existence of Bar Assistant systemd service — {{ item.service }}"
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: barassistant_service_stat

- name: Uninstall Bar Assistant systemd service
  when: barassistant_service_stat.stat.exists | bool
  block:
    - name: Ensure the systemd service is stopped
      ansible.builtin.service:
        name: "{{ item.service }}"
        state: stopped
        daemon_reload: true

    - name: Ensure the service does not exist
      ansible.builtin.file:
        dest: "{{ item.path }}"
        state: absent
