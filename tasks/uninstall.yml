---
- name: Ensure Reitti systemd services are stopped and removed
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/remove_service.yml"
  with_items:
    - service: "{{ reitti_identifier }}.service"
      path: "{{ devture_systemd_docker_base_systemd_path }}/{{ reitti_identifier }}.service"
    - { service: "{{ barassistant_server_identifier }}.service", path: "{{ devture_systemd_docker_base_systemd_path }}/{{ barassistant_server_identifier }}.service" }

- name: Ensure Reitti container network does not exist
  when: barassistant_container_network_deletion_enabled
  block:
    - name: Ensure Reitti container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ barassistant_container_network }}"
        state: absent

    - name: Ensure Reitti container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ barassistant_container_network }}
      register: network_deletion_result
      failed_when: network_deletion_result.rc > 0 and 'not found' not in network_deletion_result.stderr
      changed_when: barassistant_container_network in network_deletion_result.stdout

- name: Remove Reitti server files
  block:
    - name: Ensure Reitti server support files do not exist
      ansible.builtin.file:
        path: "{{ barassistant_server_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure Reitti server local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ barassistant_server_data_path }}"
      register: barassistant_server_data_path_deletion_result
      changed_when: barassistant_server_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Reitti server base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ barassistant_server_base_path }}"
      register: barassistant_server_base_path_deletion_result
      changed_when: barassistant_server_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Check existence of Reitti server local data path
      ansible.builtin.stat:
        path: "{{ barassistant_server_data_path }}"
      register: barassistant_server_data_path_stat

    # We just want to notify the user. Deleting data is too destructive.
    - name: Inject the message about the remaining Reitti server local data path
      when: barassistant_server_data_path_stat.stat.exists | bool
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: |
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              "Note: As the local Reitti instance has been removed, some old data remains in `" + barassistant_server_data_path + "`. Feel free to delete it."
            ]
          }}

- name: Remove Reitti Salt Rim files
  block:
    - name: Ensure Reitti Salt Rim path does not exist
      ansible.builtin.file:
        path: "{{ reitti_base_path }}"
        state: absent
