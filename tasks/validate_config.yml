---
- name: Fail if required Reitti settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - reitti_uid
    - reitti_gid
    - reitti_hostname
    - reitti_path_prefix
    - reitti_container_network
    - reitti_database_hostname
    - reitti_database_password
    - reitti_redis_hostname

- name: Run if Traefik is enabled for Reitti tile cache server
  when: reitti_tilecache_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Reitti tile cache server are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - reitti_tilecache_container_labels_traefik_hostname
        - reitti_tilecache_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `reitti_tilecache_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if reitti_tilecache_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          reitti_tilecache_container_labels_traefik_path_prefix (`{{ reitti_tilecache_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/reitti`).
      when: "reitti_tilecache_container_labels_traefik_path_prefix != '/' and reitti_tilecache_container_labels_traefik_path_prefix[-1] == '/'"

- name: Run if Traefik is enabled for Reitti
  when: reitti_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Reitti are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - reitti_container_labels_traefik_hostname
        - reitti_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `reitti_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if reitti_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          reitti_container_labels_traefik_path_prefix (`{{ reitti_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/reitti`).
      when: "reitti_container_labels_traefik_path_prefix != '/' and reitti_container_labels_traefik_path_prefix[-1] == '/'"
